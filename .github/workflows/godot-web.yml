name: Godot web build

# Builds the thread-less web export on every push/PR (downloadable artifact)
# and deploys it to GitHub Pages on pushes to master.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Dedupe PR builds, but never cancel a master run mid-deploy (deploy-pages must finish).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o tpz.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpz.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/web_* templates/version.txt "$dest/"
          rm -rf templates tpz.tpz godot.zip

      - name: Import project
        run: godot --headless --path . --import

      - name: Boot main scene (fail on script errors)
        # shell: bash enables pipefail, so a crashing/non-zero Godot is not masked by tee's exit 0.
        shell: bash
        run: |
          godot --headless --path . --quit-after 300 2>&1 | tee boot.log
          if grep -E '^(ERROR|SCRIPT ERROR):|Parse Error' boot.log; then exit 1; fi
      - name: Headless logic tests (medals, unlocks, rewards, save sanitising)
        run: godot --headless --path . -s tools/test_world_tour.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.pck

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  harness:
    # Plays the exported web build like a player (tools/harness/play.mjs): selects stops on the TourMap,
    # presses START EVENT, picks results, resets and replays. Fails on page errors, stuck states, illegal
    # phase transitions, out-of-range values or a season that never advances. Reports go to harness-out/.
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play harness - default (2 seasons)
        run: node tools/harness/play.mjs --mode default --episodes 2 --secs 40
      - name: Play harness - mobile (touch, 390x844)
        run: node tools/harness/play.mjs --mode mobile --episodes 1 --secs 30
      - name: Play harness - storage-blocked (no IndexedDB/localStorage)
        run: node tools/harness/play.mjs --mode storage-blocked --episodes 1 --secs 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-out
          path: harness-out

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.repository.private }}
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
